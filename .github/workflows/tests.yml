name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-locks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.1
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen pytest -q tests/test_workspace_lock.py tests/test_doctor.py
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.1
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen pytest -q
      - run: uv sync --frozen --extra dev --no-editable
      - run: uv run --frozen --no-editable python scripts/release_smoke.py
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cvti
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: cvti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cvti -d cvti_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cvti:test_password@127.0.0.1:5432/cvti_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.1
      - run: uv sync --frozen --extra dev
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: uv run --frozen pytest -q tests/test_db_backends.py tests/test_backup.py
