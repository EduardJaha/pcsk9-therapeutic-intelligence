[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cvti-mvp"
version = "0.2.0"
description = "PCSK9 cardiovascular therapeutic intelligence research MVP"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "rdkit>=2024.3,<2027",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "joblib>=1.4,<2",
  "psycopg[binary]>=3.2,<4",
  "streamlit>=1.66,<2",
  "altair>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "uv==0.13.1"]

[project.scripts]
cvti = "cvti.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
